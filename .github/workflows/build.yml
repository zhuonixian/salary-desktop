name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Inject build date into version
        shell: bash
        run: |
          BUILD_DATE=$(date +%Y%m%d)
          TAG_NO_V=${GITHUB_REF_NAME#v}
          echo "Injecting build date ${BUILD_DATE} into version ${TAG_NO_V}"
          # Cargo.toml: version = "x.y.z" → "x.y.z+YYYYMMDD"
          sed -i "s|^version = \".*\"|version = \"${TAG_NO_V}+${BUILD_DATE}\"|" src-tauri/Cargo.toml
          # tauri.conf.json: "version": "x.y.z" → "x.y.z+YYYYMMDD"
          sed -i "s|\"version\": \".*\"|\"version\": \"${TAG_NO_V}+${BUILD_DATE}\"|" src-tauri/tauri.conf.json
          echo "--- Cargo.toml ---"; grep '^version' src-tauri/Cargo.toml
          echo "--- tauri.conf.json ---"; grep '"version"' src-tauri/tauri.conf.json

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '工资核算助手 ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
          # 仅构建 NSIS installer（.exe），跳过 WiX/MSI：
          # WiX 要求 build metadata numeric-only 且 ≤65535，
          # 与我们用 +YYYYMMDD 表达日期的策略冲突。
          args: --bundles nsis

  build-linux:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: '工资核算助手 ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version.'
          releaseDraft: true
          prerelease: false
